# Este arquivo usa as variáveis de ambiente do arquivo .env
# O arquivo .env é criado automaticamente pelo CI/CD a partir da secret ENV_PRODUCTION
#
# Variáveis esperadas no .env:
# - DATABASE_URL: URL completa do PostgreSQL (ex: postgresql://user:pass@host:5432/db)
# - JWT_SECRET: Secret para assinatura de tokens JWT
# - NEXT_PUBLIC_API_URL: URL da API para o frontend
# - REGISTRY: Registry do Docker (padrão: ghcr.io)
# - REPO_OWNER: Owner do repositório (padrão: tickets-publicos)
# - IMAGE_TAG: Tag das imagens (padrão: latest)

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: tickets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tickets-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tickets}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API (Java Spring Boot) - Usando imagem do GHCR
  api:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-tickets-publicos}/tickets-api-java:${IMAGE_TAG:-latest}
    container_name: tickets-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrescreve com variáveis específicas do ambiente
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tickets-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Web (Next.js) - Usando imagem do GHCR
  web:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-tickets-publicos}/tickets-web:${IMAGE_TAG:-latest}
    container_name: tickets-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrescreve com variáveis específicas do ambiente
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tickets-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy - Usando imagem customizada do GHCR
  nginx:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-tickets-publicos}/tickets-nginx:${IMAGE_TAG:-latest}
    container_name: tickets-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    env_file:
      - .env
    depends_on:
      - api
      - web
    networks:
      - tickets-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # SQL Initialization - Usando imagem do GHCR (executa migrações/seeds)
  app-sql:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-tickets-publicos}/tickets-app-sql:${IMAGE_TAG:-latest}
    container_name: tickets-sql-init
    restart: "no" # Executa uma vez e para
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tickets-network

networks:
  tickets-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
